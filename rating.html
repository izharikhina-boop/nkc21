<style>
:root{color-scheme:light;--red:#FF0508;--red-d:#C70006;--bg:#F3EBDD;--ink:#33373B;--muted:#62666D;--card:#FFFFFF;--soft:#F2F2F2;--gold:#DCBF9A;--silver:#BFBFBF;--n21:linear-gradient(175deg,#FFF4DE 0%,#F7DAAA 15%,#E6B57E 36%,#F08A62 62%,#FF2A1C 84%,#E80007 100%)}
*{box-sizing:border-box}
html,body{margin:0;background:radial-gradient(60% 50% at 85% 5%,rgba(255,5,8,.10),transparent 70%),radial-gradient(55% 45% at 5% 95%,rgba(220,191,154,.35),transparent 70%),var(--bg);background-attachment:fixed;min-height:100vh;color:var(--ink);font-family:'Inter',system-ui,-apple-system,'Segoe UI',Roboto,sans-serif}
.wrap{max-width:1280px;margin:0 auto;padding:28px 16px;display:grid;gap:24px;grid-template-columns:1fr}
@media(min-width:1000px){.wrap{grid-template-columns:420px 1fr;padding:40px}}
.hero{position:relative;border-radius:32px;overflow:hidden;background:radial-gradient(80% 60% at 80% 20%,rgba(255,255,255,.9),transparent 70%),radial-gradient(70% 60% at 10% 100%,rgba(220,191,154,.45),transparent 70%),#F7F1E7;padding:32px;display:flex;flex-direction:column;gap:16px;min-height:320px}
.logo{width:min(100%,300px);color:var(--ink)}
.logo svg{display:block;width:100%;height:auto}
h1{margin:0;font-weight:900;font-size:38px;line-height:1.05;letter-spacing:-.025em}
.count{font-size:18px;color:var(--muted);font-weight:700}
.big{font-weight:900;font-size:220px;line-height:.8;letter-spacing:-.075em;background:var(--n21);-webkit-background-clip:text;background-clip:text;color:transparent;filter:drop-shadow(0 0 2cqi rgba(255,5,8,.4));margin-top:auto;animation:glow 9s ease-in-out infinite}
@keyframes glow{0%,100%{filter:drop-shadow(0 0 10px rgba(255,5,8,.45)) drop-shadow(0 0 28px rgba(255,60,40,.35))}33%{filter:drop-shadow(0 0 10px rgba(255,255,255,1)) drop-shadow(0 0 28px rgba(255,255,255,.9))}66%{filter:drop-shadow(0 0 10px rgba(255,200,80,.8)) drop-shadow(0 0 28px rgba(255,170,40,.6))}}
.coin{position:absolute;right:-6px;bottom:-14px;width:150px;animation:fl 4.2s ease-in-out infinite;filter:drop-shadow(0 14px 20px rgba(0,0,0,.25))}
@keyframes fl{0%,100%{transform:translateY(0) rotate(-4deg)}50%{transform:translateY(-8px) rotate(3deg)}}
.list{display:flex;flex-direction:column;gap:10px}
.row{display:grid;grid-template-columns:56px 1fr auto auto;gap:16px;align-items:center;background:var(--card);border-radius:999px;padding:12px 24px 12px 12px;font-size:20px;animation:in .5s both;box-shadow:0 6px 18px rgba(70,45,10,.06)}
@keyframes in{from{opacity:0;transform:translateX(20px)}}
.pos{width:44px;height:44px;border-radius:50%;background:var(--soft);display:flex;align-items:center;justify-content:center;font-weight:800}
.row:nth-child(1) .pos{background:var(--red);color:#fff}
.row:nth-child(2) .pos{background:var(--gold);color:#2A1F12}
.row:nth-child(3) .pos{background:var(--silver);color:#22252A}
.name{font-weight:700;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.sc{font-weight:900;font-size:26px;color:var(--red)}
.tm{color:var(--muted);font-size:15px;min-width:64px;text-align:right}
.empty{padding:40px;text-align:center;color:var(--muted);background:var(--card);border-radius:32px;font-size:18px}
@media (prefers-reduced-motion:reduce){*{animation:none!important}}
</style>
