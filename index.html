<!doctype html>
<html lang="ru" data-look="light">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>НКЦ 21+</title>
<meta name="description" content="Квиз к 21-летию НКЦ. Теперь можно всё.">
<meta name="theme-color" content="#F3EBDD">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800;900&display=swap" rel="stylesheet">
<style>
/* Цвета и шрифт из брендбука MOEX 2026: Red #FF0508, Beige #F3EBDD, Bronze #DCBF9A, Silver #BFBFBF, Dark grey #33373B, Inter.
   Тема: data-look="dark" (праздничный тёмный) или "light" (бежевый, как обложка брендбука). */
:root{
  color-scheme:dark;
  --bg:#141518; --surface:#1F2125; --surface-2:#2A2D32; --line:#3A3D43; --field:#18191C; --ph:#7D8188;
  --crimson:#FF0508; --crimson-d:#C70006; --crimson-h:#FF2B2E; --crimson-l:#FF3A3D;
  --gold:#DCBF9A; --gold-d:#B8946A; --gold-l:#F6E7D2; --on-gold:#2A1F12;
  --silver:#BFBFBF; --ink:#FFFFFF; --muted:#B4B7BD; --off:#3D4046; --err:#FF7A7C;
  --glow1:rgba(255,5,8,.30); --glow2:rgba(220,191,154,.18); --streak:rgba(255,235,215,.08); --streak2:rgba(255,255,255,.12);
  --rings:rgba(255,255,255,.035); --chip:rgba(255,255,255,.09); --spark:#F6E7D2;
  --party:radial-gradient(90% 70% at 75% 25%, rgba(255,5,8,.42), transparent 70%), radial-gradient(80% 70% at 15% 95%, rgba(220,191,154,.22), transparent 70%), #1C1D21;
  --n21:linear-gradient(175deg,#FFF3E2 0%,var(--gold) 34%,#E9A27A 58%,var(--crimson) 92%);
  --g1:rgba(255,5,8,.45); --g2:rgba(255,160,90,.35); --sheen:linear-gradient(108deg,transparent 42%,rgba(255,255,255,.65) 50%,transparent 58%);
  --display:'Inter',system-ui,-apple-system,'Segoe UI',Roboto,sans-serif;
  --body:'Inter',system-ui,-apple-system,'Segoe UI',Roboto,sans-serif;
  --radius:32px;
}
[data-look="light"]{
  color-scheme:light;
  --bg:#F3EBDD; --surface:#FFFFFF; --surface-2:#F2F2F2; --line:#E4DCCD; --field:#FBF8F3; --ph:#9A9DA3;
  --ink:#33373B; --muted:#62666D; --off:#E2DED6; --err:#D10006;
  --glow1:rgba(255,5,8,.10); --glow2:rgba(220,191,154,.35); --streak:rgba(255,255,255,.35); --streak2:rgba(255,255,255,.55);
  --rings:rgba(51,55,59,.035); --chip:#F3EBDD; --spark:#DCBF9A;
  --party:radial-gradient(80% 60% at 80% 20%, rgba(255,255,255,.9), transparent 70%), radial-gradient(70% 60% at 10% 100%, rgba(220,191,154,.45), transparent 70%), #F7F1E7;
  --n21:linear-gradient(175deg,#FFF4DE 0%,#F7DAAA 15%,#E6B57E 36%,#F08A62 62%,#FF2A1C 84%,#E80007 100%);
  --g1:rgba(255,5,8,.38); --g2:rgba(255,140,70,.45); --sheen:linear-gradient(108deg,transparent 42%,rgba(255,255,255,.7) 50%,transparent 58%);
}
*{box-sizing:border-box}
html,body{margin:0;color:var(--ink);font-family:var(--body);-webkit-font-smoothing:antialiased}
html{background:var(--bg)}
body{min-height:100vh;min-height:100dvh;background:
  radial-gradient(60% 50% at 85% 5%, var(--glow1), transparent 70%),
  radial-gradient(55% 45% at 5% 95%, var(--glow2), transparent 70%),
  var(--bg);background-attachment:fixed}
body::before{content:"";position:fixed;inset:-20%;pointer-events:none;z-index:0;
  background:linear-gradient(115deg, transparent 38%, var(--streak) 46%, var(--streak2) 50%, var(--streak) 54%, transparent 62%);
  animation:streak 9s ease-in-out infinite alternate}
@keyframes streak{from{transform:translateX(-6%)}to{transform:translateX(6%)}}
button,input{font:inherit}
button{cursor:pointer}
.sparkles{position:fixed;inset:0;pointer-events:none;z-index:0}
.sparkles svg{position:absolute;fill:var(--spark);opacity:.0;animation:tw 4s ease-in-out infinite}
@keyframes tw{0%,100%{opacity:.05;transform:scale(.6)}50%{opacity:.55;transform:scale(1)}}
.wrap{position:relative;z-index:1;max-width:1180px;margin:0 auto;padding:18px 16px 28px;min-height:100vh;min-height:calc(100dvh / var(--z,1));display:flex;flex-direction:column;gap:16px}
.top{display:flex;justify-content:space-between;align-items:center;gap:12px;flex-wrap:wrap}
.brand{display:flex;align-items:center;gap:10px;font-weight:700;font-size:13px;color:var(--muted);letter-spacing:.04em}
.brand b{font-family:var(--display);background:var(--crimson);color:#fff;font-weight:800;font-size:14px;padding:5px 10px;border-radius:8px}
.pills{display:flex;gap:8px;align-items:center;flex-wrap:wrap}
.pill{padding:8px 15px;border-radius:999px;background:var(--surface-2);font-weight:700;font-size:14px;white-space:nowrap}
.pill.crimson{background:var(--crimson);color:#fff}
.pill.gold{background:var(--gold);color:var(--on-gold)}
.screen{flex:1;display:flex;flex-direction:column;gap:16px;animation:in .5s cubic-bezier(.2,.8,.2,1) both}
@keyframes in{from{opacity:0;transform:translateY(18px) scale(.985)}to{opacity:1;transform:none}}
.grid{display:grid;gap:16px;grid-template-columns:1fr}
@media (min-width:900px){
  .wrap{padding:28px 40px 40px}
  .grid{grid-template-columns:repeat(2,minmax(0,1fr));gap:24px;flex:1}
  .grid>.panel{min-height:520px}
}
/* панели с концентрическими кругами, как в референсе */
.panel{position:relative;border-radius:var(--radius);overflow:hidden;padding:26px 24px;display:flex;flex-direction:column;gap:14px;background:var(--surface)}
.panel::after{content:"";position:absolute;right:-30%;bottom:-40%;width:110%;aspect-ratio:1;border-radius:50%;pointer-events:none;
  background:repeating-radial-gradient(circle, var(--rings) 0 60px, transparent 60px 120px)}
.panel>*{position:relative;z-index:1}
.panel.crimson{background:linear-gradient(150deg,var(--crimson-l) 0%,var(--crimson) 45%,var(--crimson-d) 100%);color:#fff}
.panel.crimson::after{background:repeating-radial-gradient(circle, rgba(255,255,255,.05) 0 60px, transparent 60px 120px)}
.panel.party{background:var(--party)}
h1,h2{font-family:var(--display);margin:0;letter-spacing:-.025em;text-wrap:balance}
h1{font-weight:900;font-size:clamp(26px,4vw,42px);line-height:1.1}
h2{font-weight:800;font-size:clamp(22px,3vw,32px);line-height:1.15}
p{margin:0}
.lead{font-size:16px;line-height:1.55;color:var(--muted)}
.logo{display:block;color:var(--ink)}
.logo svg{display:block;width:100%;height:auto}
.coin{display:block;filter:drop-shadow(0 18px 26px rgba(0,0,0,.28))}
.coin.float{animation:coinf 4.2s ease-in-out infinite}
@keyframes coinf{0%,100%{transform:translateY(0) rotate(-4deg)}50%{transform:translateY(-10px) rotate(3deg)}}
/* главный блок 21: всё в долях ширины карточки, чтобы композиция масштабировалась целиком */
.stagewrap{container-type:inline-size;width:100%;flex:1;display:flex;flex-direction:column;justify-content:space-between;gap:6cqi}
.h21{position:relative;width:100%;padding-top:30cqi}
/* колпак сидит на «2» набекрень влево: залетает с отскоком, потом покачивается */
.hatw{position:absolute;width:28cqi;left:4.8cqi;top:-1.6cqi;transform-origin:50% 87%;transform:rotate(-14deg);animation:hatIn 1.3s cubic-bezier(.3,1.5,.5,1) .35s both;z-index:2}
.hatimg{display:block;width:100%;transform-origin:50% 87%;filter:drop-shadow(0 1.6cqi 2cqi rgba(0,0,0,.3));animation:hatWob 3.2s ease-in-out 1.7s infinite alternate}
@keyframes hatIn{0%{opacity:0;transform:translateY(-36cqi) rotate(26deg)}55%{opacity:1;transform:translateY(1.2cqi) rotate(-20deg)}78%{transform:translateY(-.8cqi) rotate(-10deg)}100%{opacity:1;transform:rotate(-14deg)}}
@keyframes hatWob{from{transform:rotate(-3deg)}to{transform:rotate(4deg)}}
.big21{font-family:var(--display);font-weight:900;line-height:.8;letter-spacing:-.075em;font-size:78cqi;margin-left:-3cqi;white-space:nowrap;
  background:var(--sheen),var(--n21);background-size:260% 100%,100% 100%;background-repeat:no-repeat;background-position:0 0,0 0;-webkit-background-clip:text;background-clip:text;color:transparent;filter:drop-shadow(0 0 2cqi rgba(255,5,8,.5)) drop-shadow(0 0 6cqi rgba(255,60,40,.4));animation:pop21 .9s cubic-bezier(.2,1.6,.4,1) both,glow21 9s ease-in-out .9s infinite,sheen21 6.5s ease-in-out 1.2s infinite}
@keyframes sheen21{0%,30%{background-position:0 0,0 0}70%,100%{background-position:100% 0,0 0}}
/* свечение «21» плавно меняет цвет: красный → белый → золотой */
@keyframes glow21{0%,100%{filter:drop-shadow(0 0 2cqi rgba(255,5,8,.5)) drop-shadow(0 0 6cqi rgba(255,60,40,.4))}33%{filter:drop-shadow(0 0 2cqi rgba(255,255,255,1)) drop-shadow(0 0 6cqi rgba(255,255,255,.95))}66%{filter:drop-shadow(0 0 2cqi rgba(255,200,80,.8)) drop-shadow(0 0 6cqi rgba(255,170,40,.65))}}
@keyframes pop21{from{transform:scale(.6) rotate(-6deg);opacity:0}to{transform:none;opacity:1}}
.h21 .coin{position:absolute;width:40cqi;right:-1cqi;bottom:-9cqi}
.age{position:absolute;left:0;bottom:-3cqi;font-family:var(--display);font-weight:800;font-size:4.6cqi;background:var(--crimson);color:#fff;padding:.35em .8em;border-radius:999px;transform:rotate(-4deg);box-shadow:0 1.4cqi 3.4cqi rgba(255,5,8,.35)}
.stagewrap .logo{width:84cqi;margin-top:0}
/* свечи под «21»: по очереди вырастают и зажигаются, как индикатор загрузки */
.cndl{display:flex;align-items:flex-end;justify-content:space-between;width:84cqi;height:17cqi;margin-top:7cqi}
.cn{position:relative;display:block;width:2.9cqi;height:100%;display:flex;flex-direction:column;align-items:center;justify-content:flex-end}
.cn b{display:block;width:100%;border-radius:.6cqi;transform-origin:50% 100%;animation:cnRise 7s ease-in-out infinite both;animation-delay:calc(var(--i)*.12s)}
.cn:nth-child(3n+1) b{background:linear-gradient(90deg,var(--crimson-d),var(--crimson) 45%,var(--crimson-l))}
.cn:nth-child(3n+2) b{background:linear-gradient(90deg,var(--gold-d),var(--gold) 45%,var(--gold-l))}
.cn:nth-child(3n) b{background:linear-gradient(90deg,#9A9A9A,var(--silver) 45%,#F2F2F2)}
.cn s{display:block;text-decoration:none;width:1.5cqi;height:2.4cqi;margin-bottom:.5cqi;transform-origin:50% 100%;animation:cnFlick .45s ease-in-out infinite alternate;animation-delay:calc(var(--i)*-.07s)}
.cn s u{display:block;width:100%;height:100%;text-decoration:none;border-radius:50% 50% 50% 50%/65% 65% 35% 35%;background:radial-gradient(ellipse at 50% 70%,#FFF8E1 0%,#FFD479 45%,#FF9A1F 100%);box-shadow:0 0 2.2cqi rgba(255,170,50,.85);transform-origin:50% 100%;animation:cnLit 7s ease-out infinite both;animation-delay:calc(var(--i)*.12s)}
@keyframes cnRise{0%,2%{transform:scaleY(0);opacity:0}9%{transform:scaleY(1);opacity:1}92%{transform:scaleY(1);opacity:1}100%{transform:scaleY(0);opacity:0}}
@keyframes cnLit{0%,11%{transform:scale(0);opacity:0}17%{transform:scale(1.4);opacity:1}24%,92%{transform:scale(1);opacity:1}100%{transform:scale(0);opacity:0}}
@keyframes cnFlick{from{transform:scaleY(1) rotate(-3deg)}to{transform:scaleY(1.18) rotate(3deg)}}
.can{display:flex;gap:8px;flex-wrap:wrap}
.chip{padding:7px 13px;border-radius:999px;background:var(--chip);font-size:13px;font-weight:700}
label.lbl{font-size:13px;font-weight:700;color:var(--muted);letter-spacing:.02em}
.field{height:58px;width:100%;padding:0 22px;border-radius:999px;border:2px solid var(--line);background:var(--field);color:var(--ink);font-size:17px;outline:none;transition:border-color .2s,box-shadow .2s}
.field::placeholder{color:var(--ph)}
.field:focus{border-color:var(--crimson);box-shadow:0 0 0 4px rgba(255,5,8,.16)}
.btn{min-height:58px;border:0;border-radius:999px;background:var(--crimson);color:#fff;font-weight:800;font-size:17px;padding:0 28px;transition:transform .12s,background .2s,box-shadow .2s;box-shadow:0 10px 26px rgba(255,5,8,.3)}
.btn:hover{background:var(--crimson-h)}
.btn:active{transform:scale(.97)}
.btn:focus-visible,.field:focus-visible{outline:3px solid var(--gold);outline-offset:3px}
.btn.ghost{background:var(--surface-2);color:var(--ink);box-shadow:none}
a.btn{color:#fff}a.btn.ghost{color:var(--ink)}
.btn.ghost:hover{background:var(--line)}
.btn.white{background:#fff;color:var(--crimson);box-shadow:none}
.row{display:flex;gap:10px;flex-wrap:wrap}
.row>.btn{flex:1 1 160px}
.check{display:flex;gap:10px;align-items:flex-start;font-size:13px;line-height:1.45;color:var(--muted)}
.check input{width:22px;height:22px;margin:0;flex:none;accent-color:var(--crimson)}
.err{color:var(--err);font-size:14px;font-weight:700;min-height:1em}
.stamp{position:absolute;right:18px;top:18px;padding:9px 16px;border-radius:999px;background:var(--gold);color:var(--on-gold);font-family:var(--display);font-weight:800;font-size:14px;transform:rotate(6deg);z-index:3}
.stamp.hit{animation:stamp .55s cubic-bezier(.2,1.6,.4,1) both}
@keyframes stamp{0%{transform:rotate(30deg) scale(2.6);opacity:0}100%{transform:rotate(6deg) scale(1);opacity:1}}
.passwrap{position:relative;align-self:center;width:min(86%,360px);margin:auto 0}
.pass{position:relative;border-radius:22px;background:var(--surface);box-shadow:0 22px 50px rgba(70,45,10,.2),inset 0 1px 0 rgba(255,255,255,.7);padding:16px 18px 18px;transform:rotate(-3deg);overflow:hidden;animation:passIn .9s cubic-bezier(.2,1.2,.4,1) both}
[data-look="dark"] .pass{box-shadow:0 22px 50px rgba(0,0,0,.5),inset 0 1px 0 rgba(255,255,255,.06)}
@keyframes passIn{from{opacity:0;transform:translateY(40px) rotate(6deg) scale(.9)}to{opacity:1;transform:rotate(-3deg)}}
.pass-top{display:flex;justify-content:space-between;font-weight:900;font-size:12px;letter-spacing:.14em;color:var(--muted)}
.pass-top b{color:var(--crimson)}
.pass-body{display:flex;gap:14px;align-items:center;margin-top:14px}
.pass-av{flex:none;width:72px;height:72px;border-radius:18px;background:linear-gradient(150deg,var(--gold-l),var(--gold));display:flex;align-items:center;justify-content:center;font-weight:900;font-size:34px;color:var(--on-gold)}
.pass-name{font-weight:900;font-size:24px;line-height:1.1;letter-spacing:-.02em;word-break:break-word}
.pass-sub{font-size:12px;color:var(--muted);margin-top:4px}
.pass-bars{width:150px;max-width:100%;height:24px;margin-top:10px;background:repeating-linear-gradient(90deg,var(--ink) 0 2px,transparent 2px 4px,var(--ink) 4px 5px,transparent 5px 9px,var(--ink) 9px 12px,transparent 12px 14px);opacity:.75;border-radius:2px}
.scanline{position:absolute;left:0;right:0;height:50px;top:-50px;background:linear-gradient(180deg,transparent,rgba(255,5,8,.22));border-bottom:2px solid rgba(255,5,8,.75);animation:scan 4s ease-in-out .9s infinite}
@keyframes scan{0%{top:-50px}50%,100%{top:100%}}
.pass-stamp{position:absolute;right:12px;bottom:12px;padding:6px 11px;border:3px solid var(--crimson);color:var(--crimson);border-radius:10px;font-weight:900;font-size:14px;letter-spacing:.05em;opacity:0;animation:pstamp 4s ease-in .9s infinite}
@keyframes pstamp{0%,52%{opacity:0;transform:rotate(16deg) scale(2.4)}60%{opacity:1;transform:rotate(-8deg) scale(1)}90%{opacity:1;transform:rotate(-8deg) scale(1)}100%{opacity:0;transform:rotate(-8deg) scale(1)}}
.passwrap .pass-heart{position:absolute;right:-22px;bottom:-44px;z-index:2}
.rules{display:grid;gap:10px}
.rule{display:flex;gap:14px;align-items:center;padding:14px 16px;border-radius:22px;background:var(--surface-2);font-size:15px;line-height:1.45}
.rule span{flex:none;width:44px;height:44px;border-radius:14px;background:var(--crimson);color:#fff;font-family:var(--display);font-weight:800;font-size:15px;display:flex;align-items:center;justify-content:center}
.rule:nth-child(2) span{background:var(--ink);color:var(--surface)}
.rule:nth-child(3) span{background:var(--gold);color:var(--on-gold)}
/* свечи */
.candles{display:flex;align-items:flex-end;gap:4px;height:60px}
.cd{flex:1 1 0;display:flex;flex-direction:column;align-items:center;gap:3px}
.cd i{width:7px;height:11px;border-radius:50% 50% 50% 50%/65% 65% 35% 35%;background:transparent}
.cd b{display:block;width:100%;border-radius:999px;background:var(--surface-2);transition:background .4s}
.cd.ok i{background:var(--gold);box-shadow:0 0 10px var(--gold);animation:flick 1.2s ease-in-out infinite}
.cd.ok b{background:var(--crimson)}
.cd.ok:nth-child(3n+2) b{background:var(--gold)}
.cd.ok:nth-child(3n) b{background:var(--silver)}
.cd.miss b{background:var(--off)}
.cd.judge b{background:repeating-linear-gradient(180deg,var(--gold) 0 4px,var(--off) 4px 8px)}
.cd.now b{background:transparent;outline:2px solid var(--gold);animation:pulse 1.2s ease-in-out infinite}
.cd.pop b{animation:popc .6s cubic-bezier(.2,1.8,.4,1)}
@keyframes flick{0%,100%{transform:scaleY(1)}50%{transform:scaleY(1.2) translateY(-1px)}}
@keyframes pulse{50%{transform:scaleY(1.08)}}
@keyframes popc{0%{transform:scale(.4)}100%{transform:scale(1)}}
.small{font-size:12px;color:var(--muted)}
/* вопрос */
.qmeta{display:flex;gap:10px;align-items:center}
.ava{width:48px;height:48px;border-radius:16px;background:rgba(0,0,0,.16);display:flex;align-items:center;justify-content:center;flex:none;font-weight:900;font-size:15px}
.qno{font-family:var(--display);font-weight:900;font-size:64px;line-height:.9;opacity:.22;position:absolute!important;right:22px;top:18px}
.qtext{font-weight:700;font-size:clamp(19px,2.2vw,26px);line-height:1.38}
.handout{align-self:flex-start;background:#fff;color:#33373B;border-radius:18px;padding:12px 16px;font-weight:800;font-size:17px;transform:rotate(-1.5deg);box-shadow:0 10px 24px rgba(0,0,0,.3)}
.handout small{display:block;font-size:11px;font-weight:800;color:var(--crimson);text-transform:uppercase;letter-spacing:.08em;margin-bottom:2px}
.timer{display:flex;align-items:center;gap:14px}
.ring{width:66px;height:66px;flex:none;position:relative}
.ring svg{transform:rotate(-90deg)}
.ring .num{position:absolute;inset:0;display:flex;align-items:center;justify-content:center;font-family:var(--display);font-weight:800;font-size:19px}
.ring.low .num{color:var(--crimson)}
.ring .track{stroke:var(--off)}
.ring.low{animation:shake .5s linear infinite}
@keyframes shake{25%{transform:translateX(-1px)}75%{transform:translateX(1px)}}
.verdict{border-radius:var(--radius);padding:24px 22px;display:flex;flex-direction:column;gap:10px;animation:in .4s both}
.verdict.ok{background:linear-gradient(150deg,var(--gold-l),var(--gold) 55%,var(--gold-d));color:var(--on-gold)}
.verdict.miss{background:var(--surface)}
.verdict.judge{background:var(--silver);color:#22252A}
.verdict .vt{font-family:var(--display);font-weight:800;font-size:24px}
.verdict .ans{font-size:17px;line-height:1.45}
.verdict .cm{font-size:15px;line-height:1.55;opacity:.88}
.wrong{animation:wobble .45s}
@keyframes wobble{20%{transform:translateX(-8px)}40%{transform:translateX(8px)}60%{transform:translateX(-5px)}80%{transform:translateX(5px)}}
.tourno{font-family:var(--display);font-weight:900;font-size:clamp(100px,18vw,200px);line-height:.85;letter-spacing:-.05em;background:var(--n21);-webkit-background-clip:text;background-clip:text;color:transparent}
/* финал */
.cake{width:100%;max-width:440px;align-self:center;cursor:pointer;-webkit-tap-highlight-color:transparent}
.cake .fl{transform-origin:center bottom;transform-box:fill-box;animation:flick 1.1s ease-in-out infinite}
.cake.out .fl{animation:blow .5s forwards}
@keyframes blow{to{transform:scale(0) translateX(6px);opacity:0}}
.score{display:flex;align-items:baseline;gap:8px;flex-wrap:wrap}
.score .n{font-family:var(--display);font-weight:900;font-size:76px;line-height:1;letter-spacing:-.04em;background:var(--n21);-webkit-background-clip:text;background-clip:text;color:transparent}
.score .of{font-family:var(--display);font-weight:600;font-size:26px;color:var(--muted)}
.rank{align-self:flex-start;padding:10px 20px;border-radius:999px;background:var(--crimson);color:#fff;font-family:var(--display);font-weight:800;font-size:17px}
.status{font-size:13px;color:var(--muted);text-align:center}

var SURN = /(ов|ова|ев|ева|ёв|ёва|ин|ина|ын|ына|ский|ская|цкий|цкая|ной|ных|ых|их|енко|ко|юк|ук|ян|дзе|швили)$/i;
function firstName(n){
  n = String(n||"").trim(); if (!n) return "";
  if (n.indexOf("@") > 0) {
    var loc = n.split("@")[0].split(/[._\-]/)[0].replace(/[0-9]+/g,"");
    return /^[a-zа-яё]{2,}$/i.test(loc) && !/^(info|admin|test|mail|office|user|hr|support|noreply)$/i.test(loc) ? cap1(loc.toLowerCase()) : "";
  }
  var w = n.split(/\s+/).filter(function(x){ return !PATR.test(x); });
  if (!w.length) return n.split(/\s+/)[0];
  if (w.length === 1) return w[0];
  var a = w[0], b = w[1];
  if (SURN.test(a) && !SURN.test(b)) return b;
  if (SURN.test(b) && !SURN.test(a)) return a;
  return b;
}
function cap1(s){ return s ? s.charAt(0).toUpperCase() + s.slice(1) : s; }
function esc(s){ return String(s).replace(/[&<>"']/g, function(c){ return {"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]; }); }

/* ---------- проверка ответов ---------- */
function norm(s){
  return String(s||"").toLowerCase().replace(/ё/g,"е").replace(/й/g,"и")
    .replace(/[^a-zа-я0-9]+/g," ").trim();
}
function lev1(a, b, k){
  if (Math.abs(a.length - b.length) > k) return false;
  var p = [], i, j; for (j=0;j<=b.length;j++) p[j]=j;
  for (i=1;i<=a.length;i++){ var c=[i], mn=i; for (j=1;j<=b.length;j++){ c[j]=Math.min(p[j]+1,c[j-1]+1,p[j-1]+(a.charAt(i-1)===b.charAt(j-1)?0:1)); if(c[j]<mn) mn=c[j]; } if (mn>k) return false; p=c; }
  return p[b.length] <= k;
}
/* слово ввода x подходит слову ответа w: точно, обрезано, другое окончание или опечатка */
function wordEq(x, w){
  if (x === w) return true;
  if (x.length >= 4 && w.length > x.length && w.indexOf(x) === 0) return true;
  if (w.length >= 5 && x.length >= 4){
    var k = 0; while (k < x.length && k < w.length && x.charAt(k) === w.charAt(k)) k++;
    if (k >= Math.max(5, w.length - 3) && Math.abs(x.length - w.length) <= 3) return true;
  }
  if (w.length >= 5 && lev1(x, w, w.length >= 9 ? 2 : 1)) return true;
  return false;
}
function has(input, v){
  var n = " " + norm(input) + " ", w = norm(v);
  if (!w) return false;
  if (n.indexOf(" " + w + " ") >= 0) return true;
  if (n.replace(/ /g,"") === w.replace(/ /g,"")) return true;
  var xs = n.trim().split(" "), ws = w.split(" ");
  for (var i=0; i + ws.length <= xs.length; i++){
    var ok = true;
    for (var j=0;j<ws.length;j++) if (!wordEq(xs[i+j], ws[j])) { ok = false; break; }
    if (ok) return true;
  }
  return false;
}
function judge(q, input){
  var c = q.check, t = String(input||"").trim();
  if (!t) return "miss";
  if (c.type === "any"){
    for (var i=0;i<c.v.length;i++) if (has(t, c.v[i])) return "ok";
    if (c.judge) for (var j=0;j<c.judge.length;j++) if (has(t, c.judge[j])) return "judge";
    return "miss";
  }
  if (c.type === "all"){
    for (var g=0; g<c.groups.length; g++){
      var hit = false;
      for (var k=0;k<c.groups[g].length;k++) if (has(t, c.groups[g][k])) hit = true;
      if (!hit) return "miss";
    }
    return "ok";
  }
  if (c.type === "range"){
    var nums = t.replace(/,/g,".").match(/\d+(\.\d+)?/g) || [];
    for (var m=0;m<nums.length;m++){ var x = parseFloat(nums[m]); if (x >= c.min && x <= c.max) return "ok"; }
    return "miss";
  }
  return "miss";
}

        '<input class="field" id="who" autocomplete="name" maxlength="120" placeholder="Иванова Анна Сергеевна / a.ivanova@…" value="'+esc(S.name)+'">'+
        '<label class="check"><input type="checkbox" id="ok"> <span>Согласен(на), что организатор увидит моё имя и результат квиза</span></label>'+
        '<div class="err" id="err"></div>'+
        '<button class="btn" type="submit">Пройти фейс-контроль</button>'+
      '</form>')+
    '</section></div></div>';
  var f = $("#f"); if (!f) return;
  f.addEventListener("submit", function(e){
    e.preventDefault();
    var v = $("#who").value.trim().replace(/\s+/g," ");
    if (v.length < 3) { $("#err").textContent = "Напиши ФИО или почту, чтобы фейс-контроль тебя пропустил."; $("#who").focus(); return; }
    if (!$("#ok").checked) { $("#err").textContent = "Нужна галочка согласия."; return; }
    S.name = v; save();
    var st = $("#stamp"); st.hidden = false; st.classList.add("hit");
    burst(90);
    setTimeout(function(){ go("rules"); }, 950);
  });
}

function passCard(fn){
  var nm = fn ? cap1(fn) : "Гость", bars = "";
  return '<div class="passwrap"><div class="pass"><div class="pass-top"><b>НКЦ 21+/-</b><span>ПРОПУСК</span></div>'+
    '<div class="pass-body"><div class="pass-av">'+esc(nm.charAt(0))+'</div><div><div class="pass-name">'+esc(nm)+'</div><div class="pass-sub">гость · 24.10.2026</div><div class="pass-bars"></div></div></div>'+
    '<div class="scanline"></div><div class="pass-stamp">ДОПУЩЕН 21+/-</div></div></div>';
}
function vRules(){
  var fn = firstName(S.name);
  setPills([["21+/-","crimson"]]);
  app.innerHTML = '<div class="screen"><div class="grid">'+
    '<section class="panel party"><h2>Привет'+(fn?', '+esc(cap1(fn)):'')+'!</h2><p class="lead">Правила квиза 21+/-. Можно всё, кроме гугла.</p>'+passCard(fn)+
      '<div style="display:flex;align-items:flex-end;justify-content:space-between;gap:12px">'+logo("min(58%,300px)")+pic("cap","min(30%,150px)","float")+'</div></section>'+
    '<section class="panel"><div class="rules">'+
      '<div class="rule"><span>3</span>тура по 7 вопросов: «Родословная», «Профессия ЦК», «24 октября и вокруг»</div>'+
      '<div class="rule"><span>60</span>секунд на вопрос. Время вышло, и уходит то, что успел написать</div>'+
      '<div class="rule"><span>=</span>Можно отвечать быстрее: при равенстве баллов выше окажется тот, кто справился скорее</div>'+
      '<div class="rule"><span>Аа</span>Ответ пишешь сам, вариантов нет. Регистр и «ё» не важны</div>'+
      '<div class="rule"><span>1</span>попытка. Страницу можно обновить, таймер не сбросится</div>'+
    '</div><button class="btn" id="go" style="margin-top:auto">Поехали!</button></section>'+
  '</div></div>';
  $("#go").onclick = function(){ if(!S.startedAt) S.startedAt = Date.now(); go("tour"); };
}

function vTour(){
  var t = Q[S.idx].t, tour = TOURS[t];
  setPills([["Вопрос "+(S.idx+1)+" / 21"],["Счёт "+score(),"crimson"]]);
  var prev = "";
  if (t > 0){ var s=0; for (var i=(t-1)*7;i<t*7;i++) if (S.answers[i] && S.answers[i].v==="ok") s++; prev = '<span class="chip">Тур '+t+' позади: '+s+' из 7</span>'; }
  app.innerHTML = '<div class="screen"><div class="grid">'+
    '<section class="panel party" style="justify-content:flex-end;gap:18px">'+prev+'<div class="tourno">0'+(t+1)+'</div>'+
      '<h1>'+esc(tour.name)+'</h1><p class="lead">'+esc(tour.sub)+'</p>'+
      '<button class="btn" id="go" style="align-self:flex-start">'+(t===0?"Первый вопрос":"Продолжить")+'</button></section>'+
    '<section style="display:flex;flex-direction:column;gap:16px"><div class="panel crimson hide-m" style="flex:1;align-items:center;justify-content:center">'+pic(["heart","capbag","gift"][t],"min(55%,240px)","float")+'</div>'+candles()+'</section></div></div>';
  $("#go").onclick = function(){ startQ(); };
  $("#go").focus();
}

function startQ(){ S.qStartedAt = Date.now(); S.draft = ""; go("q"); }

function vQuestion(){
  var q = Q[S.idx], secs = CONFIG.secondsPerQuestion;
  if (!S.qStartedAt) S.qStartedAt = Date.now();
  setPills([["Вопрос "+q.n+" / 21"],["Счёт "+score(),"crimson"]]);
  app.innerHTML = '<div class="screen"><div class="grid">'+
    '<section class="panel crimson"><div class="qno">'+(q.n<10?"0":"")+q.n+'</div>'+
      '<div class="qmeta"><div class="ava">'+(q.t+1)+'/3</div><div style="font-size:14px;font-weight:700;opacity:.92">'+esc(TOURS[q.t].name)+(q.final?" · ФИНАЛ":"")+'</div></div>'+
      (q.h ? '<div class="handout"><small>Раздатка</small>'+esc(q.h)+'</div>' : '')+
      '<div class="qtext">'+esc(q.q)+'</div></section>'+
    '<section style="display:flex;flex-direction:column;gap:16px">'+
      '<form class="panel" id="f" novalidate>'+
        '<div class="timer"><div class="ring" id="ring"><svg width="66" height="66" viewBox="0 0 66 66" aria-hidden="true"><circle cx="33" cy="33" r="28" fill="none" class="track" stroke-width="6"></circle><circle id="arc" cx="33" cy="33" r="28" fill="none" stroke="var(--gold)" stroke-width="6" stroke-linecap="round" stroke-dasharray="175.9" stroke-dashoffset="0"></circle></svg><div class="num" id="sec">'+secs+'</div></div>'+
        '<label class="lbl" for="ans" style="font-size:15px">Твой ответ</label></div>'+
        '<input class="field" id="ans" autocomplete="off" autocapitalize="off" spellcheck="false" maxlength="200" placeholder="Пиши здесь…">'+
        '<div class="row"><button class="btn" type="submit">Ответить</button><button class="btn ghost" type="button" id="skip">Не знаю</button></div>'+
        '<div class="kbd">Enter — ответить</div>'+
      '</form>'+candles()+'</section></div></div>';
  var inp = $("#ans"); inp.value = S.draft || ""; inp.focus();
  inp.addEventListener("input", function(){ S.draft = inp.value; save(); });
  $("#f").addEventListener("submit", function(e){ e.preventDefault(); answer(inp.value); });
  $("#skip").onclick = function(){ answer(""); };
  var arc = document.getElementById("arc"), sec = document.getElementById("sec"), ring = document.getElementById("ring");
  function upd(){
    var left = secs*1000 - (Date.now() - S.qStartedAt);
    if (left <= 0){ clearInterval(tick); answer(inp.value, true); return; }
    var s = Math.ceil(left/1000);
    sec.textContent = s;
    arc.setAttribute("stroke-dashoffset", (175.9 * (1 - left/(secs*1000))).toFixed(1));
    arc.setAttribute("stroke", s <= 10 ? "var(--crimson)" : "var(--gold)");
    ring.classList.toggle("low", s <= 10);
  }
  upd(); tick = setInterval(upd, 100);
}

function answer(text, timeout){
  clearInterval(tick);
  if (S.stage !== "q") return;
  var q = Q[S.idx], v = judge(q, text);
  S.answers[S.idx] = { n:q.n, a:String(text||"").trim().slice(0,200), v:v, ms: Math.min(Date.now()-S.qStartedAt, CONFIG.secondsPerQuestion*1000), to: !!timeout };
  S.draft = "";
  go("reveal");
  if (v === "ok"){ burst(80); var c = app.querySelector('.cd[data-i="'+S.idx+'"]'); if (c) c.classList.add("pop"); }
  else if (v === "miss"){ var vd = $(".verdict"); if (vd) vd.classList.add("wrong"); }
}

var OKS = ["Верно! +1 свеча","В точку!","Совершеннолетний ответ!","ЦК одобряет!","Клиринг прошёл!"];
var MISS = ["Мимо, но не страшно","Не в этот раз","Почти! Это был не он","Риск реализовался"];
function vReveal(){
  var q = Q[S.idx], a = S.answers[S.idx], last = S.idx === TOTAL-1;
  setPills([["Вопрос "+q.n+" / 21"],["Счёт "+score(),"crimson"]]);
  var title = a.v==="ok" ? OKS[q.n % OKS.length] : a.v==="judge" ? "Спорно: решит ведущий" : (a.to && !a.a ? "Время вышло" : MISS[q.n % MISS.length]);
  app.innerHTML = '<div class="screen"><div class="grid">'+
    '<section class="panel crimson"><div class="qno">'+(q.n<10?"0":"")+q.n+'</div><div class="qmeta"><div class="ava">'+(q.t+1)+'/3</div><div style="font-size:14px;font-weight:700;opacity:.92">Вопрос '+q.n+'</div></div><div class="qtext" style="font-size:clamp(16px,1.8vw,20px);font-weight:600;opacity:.92">'+esc(q.q)+'</div></section>'+
    '<section style="display:flex;flex-direction:column;gap:16px">'+
      '<div class="verdict '+a.v+'" role="status"><div class="vt">'+title+'</div>'+
        (a.a ? '<div class="ans">Твой ответ: <b>'+esc(a.a)+'</b></div>' : '')+
        '<div class="ans">Правильный ответ: <b>'+esc(q.a)+'</b></div>'+
        '<div class="cm">'+esc(q.c)+'</div></div>'+candles()+
      '<button class="btn" id="next" style="margin-top:auto">'+(last ? "Узнать итог" : "Дальше")+'</button>'+
      '<div class="kbd">Enter — дальше</div></section></div></div>';
  var b = $("#next"); b.focus();
  b.onclick = function(){
    S.idx++;
    if (S.idx >= TOTAL){ S.finishedAt = Date.now(); try{ localStorage.setItem(DONE, "1"); }catch(e){} go("final"); send(); }
    else if (S.idx % 7 === 0) go("tour");
    else startQ();
  };
}

var RANKS = [[21,"Центральный контрагент"],[19,"Член ЦК"],[16,"Клиринговый магнат"],[12,"Риск-менеджер"],[7,"Уверенный контрагент"],[0,"Стажёр клиринга"]];
function rank(s){ for (var i=0;i<RANKS.length;i++) if (s >= RANKS[i][0]) return RANKS[i][1]; }
function vFinal(){
  var s = score(), j = judges();
  setPills([["Итог","crimson"],["21+/-","gold"]]);
  var cs = "", fl = "", pal = ["var(--crimson)","var(--gold)","var(--silver)"];
  for (var i=0;i<TOTAL;i++){
    var x = 50 + i*12, lit = S.answers[i] && S.answers[i].v==="ok";
    cs += '<rect x="'+x+'" y="58" width="9" height="40" rx="4.5" fill="'+(lit?pal[i%3]:"var(--off)")+'"/>';
    if (lit) fl += '<ellipse class="fl" style="animation-delay:'+(i*0.05)+'s" cx="'+(x+4.5)+'" cy="49" rx="4.5" ry="8" fill="var(--gold)"/>';
  }
  var cake = '<svg class="cake" id="cake" viewBox="0 0 350 235" role="button" tabindex="0" aria-label="Торт: нажми, чтобы задуть свечи">'+cs+fl+
    '<rect x="40" y="96" width="270" height="60" rx="16" fill="var(--crimson)"/><rect x="48" y="102" width="254" height="10" rx="5" fill="#fff" opacity=".3"/>'+
    '<rect x="22" y="152" width="306" height="70" rx="18" fill="var(--gold)"/><text x="175" y="198" text-anchor="middle" font-family="Inter,sans-serif" font-weight="900" font-size="28" fill="#2A1F12">НКЦ · 21</text></svg>';
  app.innerHTML = '<div class="screen"><div class="grid">'+
    '<section class="panel party" style="justify-content:center;align-items:center">'+pic("hat","min(26%,120px)","float")+cake+
      '<p class="small" style="text-align:center">Нажми на торт, чтобы задуть свечи</p></section>'+
    '<section class="panel" style="justify-content:flex-end">'+
      '<div class="score"><div class="n">'+s+'</div><div class="of">/ 21</div>'+(j?'<div class="pill gold" style="margin-left:auto">+'+j+' на суд ведущего</div>':'')+'</div>'+
      '<div class="rank">'+rank(s)+'</div>'+
      '<p class="lead">'+(firstName(S.name)?esc(cap1(firstName(S.name)))+', с':'С')+'овершеннолетие подтверждено, центральный контрагент одобряет. С днём рождения, НКЦ!</p>'+
      '<div style="display:flex;align-items:flex-end;justify-content:space-between;gap:12px">'+logo("min(62%,320px)")+pic("heart","min(26%,110px)","float")+'</div>'+
      '<div class="row" id="actions"></div><div class="status" id="st"></div>'+
    '</section></div></div>';
  var cake2 = document.getElementById("cake");
  function blow(){ if (cake2.classList.contains("out")) return; cake2.classList.add("out"); burst(200); }
  cake2.onclick = blow; cake2.onkeydown = function(e){ if (e.key==="Enter"||e.key===" "){ e.preventDefault(); blow(); } };
  showSendState();
}

/* ---------- отправка результата ---------- */
function payload(){
  return { attempt_id:S.id, participant:S.name, score:score(), judge_count:judges(),
    duration_sec: Math.round(((S.finishedAt||Date.now()) - (S.startedAt||Date.now()))/1000),
    answers:S.answers, started_at:new Date(S.startedAt||Date.now()).toISOString(),
    finished_at:new Date(S.finishedAt||Date.now()).toISOString(), user_agent:navigator.userAgent.slice(0,200) };
}
function useDb(){ return (CONFIG.mode==="supabase"||CONFIG.mode==="both") && (CONFIG.appsUrl || (CONFIG.supabaseUrl && CONFIG.supabaseKey)); }
function useMail(){ return (CONFIG.mode==="email"||CONFIG.mode==="both") && CONFIG.organizerEmail; }
function postDb(){
  var ctl = window.AbortController ? new AbortController() : null, tm = ctl ? setTimeout(function(){ ctl.abort(); }, 10000) : 0;
  return fetch(CONFIG.supabaseUrl.replace(/\/$/,"") + "/rest/v1/" + CONFIG.table, {
    method:"POST", signal: ctl ? ctl.signal : undefined,
    headers:{ "apikey":CONFIG.supabaseKey, "Authorization":"Bearer "+CONFIG.supabaseKey, "Content-Type":"application/json", "Prefer":"return=minimal" },
    body: JSON.stringify(payload())
  }).then(function(r){ clearTimeout(tm); return r.ok || r.status===409; }, function(){ clearTimeout(tm); return false; });
}
/* запасной канал: форма Netlify (приходит в кабинет Netlify, работает и там, где supabase.co недоступен) */
function postForm(){
  var p = payload(), o = { "form-name":"nkc21", attempt_id:p.attempt_id, participant:p.participant, score:p.score, judge_count:p.judge_count, duration_sec:p.duration_sec, answers:JSON.stringify(S.answers.map(function(a){ return [a.n, a.a, a.v]; })), user_agent:p.user_agent };
  var body = Object.keys(o).map(function(k){ return encodeURIComponent(k)+"="+encodeURIComponent(o[k]); }).join("&");
  var ctl = window.AbortController ? new AbortController() : null, tm = ctl ? setTimeout(function(){ ctl.abort(); }, 10000) : 0;
  return fetch("/", { method:"POST", signal: ctl ? ctl.signal : undefined, headers:{ "Content-Type":"application/x-www-form-urlencoded" }, body: body })
    .then(function(r){ clearTimeout(tm); return r.ok; }, function(){ clearTimeout(tm); return false; });
}
/* Google Apps Script: ответ нельзя прочитать из другого домена, поэтому считаем успехом отсутствие сетевой ошибки */
function postApps(){
  var ctl = window.AbortController ? new AbortController() : null, tm = ctl ? setTimeout(function(){ ctl.abort(); }, 15000) : 0;
  return fetch(CONFIG.appsUrl, { method:"POST", mode:"no-cors", signal: ctl ? ctl.signal : undefined, headers:{ "Content-Type":"text/plain;charset=utf-8" }, body: JSON.stringify(payload()) })
    .then(function(){ clearTimeout(tm); return true; }, function(){ clearTimeout(tm); return false; });
}
function send(){
  if (!useDb() || S.sent) { showSendState(); return; }
  var st = document.getElementById("st"); if (st){ st.className="status"; st.textContent = "Отправляю результат организатору…"; }
  (CONFIG.appsUrl ? postApps().then(function(ok){ return [ok, false]; }) : Promise.all([postDb(), postForm()])).then(function(r){
    if (r[0] || r[1]){ S.sent = true; save(); }
    showSendState(!(r[0] || r[1]));
  });
}
function mailHref(){
  var p = payload(), lines = ["Участник: "+p.participant, "Счёт: "+p.score+" / 21"+(p.judge_count?" (+"+p.judge_count+" на суд ведущего)":""), "Время: "+p.duration_sec+" сек", ""];
  S.answers.forEach(function(a){ lines.push(a.n+". "+(a.a||"—")+"  ["+({ok:"верно",miss:"неверно",judge:"спорно"})[a.v]+"]"); });
  return "mailto:"+encodeURIComponent(CONFIG.organizerEmail)+"?subject="+encodeURIComponent("НКЦ 21+: "+p.participant+" — "+p.score+"/21")+"&body="+encodeURIComponent(lines.join("\n"));
}
function showSendState(failed){
  var st = document.getElementById("st"), act = document.getElementById("actions"); if (!st || !act) return;
  act.innerHTML = "";
  if (useDb()){
    if (S.sent){ st.className="status"; st.textContent = "Результат уже у организатора ✓"; }
    else if (failed){ st.className="status bad"; st.textContent = "Не получилось отправить. Проверь интернет и нажми ещё раз."; act.innerHTML = '<button class="btn" id="retry">Отправить ещё раз</button>'; document.getElementById("retry").onclick = send; }
    else { st.className="status"; st.textContent = "Отправляю результат организатору…"; }
  }
  if (useMail()){
    act.insertAdjacentHTML("beforeend", '<a class="btn'+(useDb()?" ghost":"")+'" style="display:flex;align-items:center;justify-content:center;text-decoration:none" href="'+mailHref()+'">Отправить результат письмом</a>');
    if (!useDb()){ st.className="status"; st.textContent = "Нажми кнопку, чтобы письмо с результатом ушло организатору."; }
  }
  if (!useDb() && !useMail()){ st.className="status"; st.textContent = "Демо-режим: результат сохранён только на этом устройстве."; }
}

/* ---------- искры на фоне ---------- */
(function(){
  var box = document.getElementById("sparkles"), pts = [[6,14,22],[18,72,14],[30,30,10],[46,88,18],[62,10,12],[74,58,24],[88,24,16],[94,80,12],[12,48,10],[52,40,8],[82,92,10],[38,6,14]];
  box.innerHTML = pts.map(function(p,i){ return '<svg viewBox="0 0 24 24" width="'+p[2]+'" height="'+p[2]+'" style="left:'+p[0]+'%;top:'+p[1]+'%;animation-delay:'+(i*0.37)+'s"><path d="M12 0 C13 8 16 11 24 12 C16 13 13 16 12 24 C11 16 8 13 0 12 C8 11 11 8 12 0 Z"/></svg>'; }).join("");
})();

/* ---------- конфетти ---------- */
var cv = document.getElementById("confetti"), cx = cv.getContext("2d"), parts = [], raf = null, amb = false;
var COLS = ["#FF0508","#DCBF9A","#BFBFBF","#F6E7D2","#FF0508","#B8946A"];
var REDUCED = window.matchMedia && matchMedia("(prefers-reduced-motion: reduce)").matches;
function size(){ cv.width = innerWidth * devicePixelRatio; cv.height = innerHeight * devicePixelRatio; }
size(); addEventListener("resize", size);
/* на широком экране масштабируем страницу так, чтобы экран целиком помещался по высоте */
var FZ = 1, fitT = 0;
function fit(){
  var w = document.querySelector(".wrap"), z = 1;
  if (innerWidth >= 900){
    w.style.minHeight = "0";
    for (var i=0; i<4; i++){
      w.style.zoom = z; w.style.setProperty("--z", z);
      var h = w.offsetHeight, nz = h > 0 ? Math.max(.5, Math.min(1.5, innerHeight / h)) : 1;
      if (Math.abs(nz - z) < .01) break;
      z = nz;
    }
    w.style.minHeight = "";
    if (z > .97 && z < 1.03) z = 1;
  }
  FZ = z; w.style.zoom = z; w.style.setProperty("--z", z);
}
function fitSoon(){ clearTimeout(fitT); fitT = setTimeout(function(){ requestAnimationFrame(fit); }, 60); }
addEventListener("resize", fitSoon); addEventListener("load", fitSoon);
if (window.ResizeObserver) new ResizeObserver(fitSoon).observe(app);
if (document.fonts && document.fonts.ready) document.fonts.ready.then(fitSoon);
function piece(x, y, vx, vy){ return { x:x, y:y, vx:vx, vy:vy, r:Math.random()*6+4, c:COLS[Math.floor(Math.random()*COLS.length)], a:Math.random()*6, va:(Math.random()-.5)*.3, kind: Math.random()<.3 ? "s" : (Math.random()<.5 ? "c" : "r"), g:.32 }; }
function burst(n){
  if (REDUCED) return;
  for (var i=0;i<n;i++) parts.push(piece(innerWidth/2 + (Math.random()-.5)*innerWidth*.6, innerHeight*.35, (Math.random()-.5)*10, -Math.random()*12-3));
  if (!raf) raf = requestAnimationFrame(step);
}
function ambient(on){ amb = on && !REDUCED; if (amb && !raf) raf = requestAnimationFrame(step); }
function star(r){ cx.beginPath(); for (var k=0;k<8;k++){ var rr = k%2 ? r*.38 : r; var an = k*Math.PI/4; cx.lineTo(Math.cos(an)*rr, Math.sin(an)*rr); } cx.closePath(); cx.fill(); }
function step(){
  var d = devicePixelRatio; cx.clearRect(0,0,cv.width,cv.height);
  if (amb && parts.length < 60 && Math.random() < .25){ var p = piece(Math.random()*innerWidth, -20, (Math.random()-.5)*1.2, Math.random()*1.5+1); p.g = .02; parts.push(p); }
  parts = parts.filter(function(p){ return p.y < innerHeight + 40; });
  parts.forEach(function(p){
    p.vy += p.g; if (p.g < .1 && p.vy > 2.4) p.vy = 2.4; p.x += p.vx + (p.g < .1 ? Math.sin(p.y/40)*.5 : 0); p.y += p.vy; p.a += p.va;
    cx.save(); cx.translate(p.x*d, p.y*d); cx.rotate(p.a); cx.fillStyle = p.c;
    if (p.kind === "s") star(p.r*d*.9);
    else if (p.kind === "c"){ cx.beginPath(); cx.arc(0,0,p.r*d*.45,0,Math.PI*2); cx.fill(); }
    else cx.fillRect(-p.r*d/2, -p.r*d/2, p.r*d, p.r*d*.5);
    cx.restore();
  });
  raf = (parts.length || amb) ? requestAnimationFrame(step) : null;
}

if (S.stage === "final" && !S.sent) setTimeout(send, 300);
render();
</script>
